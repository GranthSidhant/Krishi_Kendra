{% extends "base.html" %}

{% block title %}Edit Produce - Krishi Kendra{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="k-card shadow-sm border-0 p-4">
        
        <div class="d-flex align-items-center gap-2 mb-4 pb-2 border-bottom">
          <a href="{{ url_for('farmer.inventory') }}" class="btn btn-sm btn-light border"><i class="fas fa-arrow-left"></i></a>
          <h4 class="fw-bold mb-0 text-success"><i class="fas fa-edit me-2"></i> Edit Produce: {{ item.product_name }}</h4>
        </div>

        <form method="POST" action="{{ url_for('farmer.edit_inventory', item_id=item.id) }}" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label fw-semibold">Product Name</label>
            <input type="text" name="product_name" class="form-control" value="{{ item.product_name }}" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Available Quantity</label>
              <input type="number" step="0.5" name="available_quantity" class="form-control" value="{{ item.available_quantity }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Unit</label>
              <select name="unit" class="form-select">
                <option value="kg" {% if item.unit == 'kg' %}selected{% endif %}>kg</option>
                <option value="quintal" {% if item.unit == 'quintal' %}selected{% endif %}>quintal</option>
                <option value="ton" {% if item.unit == 'ton' %}selected{% endif %}>ton</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Price (₹/unit)</label>
              <input type="number" step="0.5" name="expected_price_per_unit" class="form-control" value="{{ item.expected_price_per_unit }}" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Quality Grade</label>
              <select name="quality_grade" class="form-select">
                <option value="Grade A (Premium)" {% if 'Grade A' in item.quality_grade %}selected{% endif %}>Grade A (Premium)</option>
                <option value="Grade B (Standard)" {% if 'Grade B' in item.quality_grade %}selected{% endif %}>Grade B (Standard)</option>
                <option value="Grade C (Economy)" {% if 'Grade C' in item.quality_grade %}selected{% endif %}>Grade C (Economy)</option>
                <option value="Certified Organic" {% if 'Organic' in item.quality_grade %}selected{% endif %}>Certified Organic</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Availability Status</label>
              <select name="status" class="form-select">
                <option value="available" {% if item.status == 'available' %}selected{% endif %}>Available</option>
                <option value="low_stock" {% if item.status == 'low_stock' %}selected{% endif %}>Low Stock</option>
                <option value="sold_out" {% if item.status == 'sold_out' %}selected{% endif %}>Sold Out</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Update Produce Photo</label>
            <input type="file" name="produce_image_file" class="form-control" accept="image/*">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ item.description }}</textarea>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg fw-bold">
              <i class="fas fa-save me-2"></i> Update Produce
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
