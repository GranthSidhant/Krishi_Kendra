{% extends "base.html" %}

{% block title %}Login - Krishi Kendra{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="k-card shadow-lg border-0 p-4">
        
        <!-- Header -->
        <div class="text-center mb-3">
          <i class="fas fa-leaf text-success fs-1 mb-2"></i>
          <h3 class="fw-bold text-dark">Sign In to Krishi Kendra</h3>
          <p class="text-muted small mb-0">Direct Farm-to-Buyer Marketplace & Mandi Network</p>
        </div>

        <!-- Role Login Switcher Tabs -->
        <ul class="nav nav-pills nav-fill mb-3 p-1 bg-light rounded-3" id="loginRoleTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold small" id="tab-farmer-buyer" data-bs-toggle="pill" data-bs-target="#panel-farmer-buyer" type="button" role="tab">
              <i class="fas fa-users me-1 text-success"></i> Farmer / Buyer
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold small text-danger" id="tab-admin" data-bs-toggle="pill" data-bs-target="#panel-admin" type="button" role="tab">
              <i class="fas fa-shield-alt me-1"></i> Admin Portal
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Farmer / Buyer Login Panel -->
          <div class="tab-pane fade show active" id="panel-farmer-buyer" role="tabpanel">
            <form method="POST" action="{{ url_for('auth.login') }}">
              <div class="mb-3">
                <label class="form-label fw-semibold">Mobile Number or Krishi ID</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-phone text-muted"></i></span>
                  <input type="text" name="login_id" id="userLoginId" class="form-control" placeholder="e.g. 9876543210 or FK-2026-1001" required autofocus>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                  <input type="password" name="password" id="userPassword" class="form-control" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                  <i class="fas fa-sign-in-alt me-2"></i> Log In to Dashboard
                </button>
              </div>
            </form>
          </div>

          <!-- Admin Portal Panel -->
          <div class="tab-pane fade" id="panel-admin" role="tabpanel">
            <form method="POST" action="{{ url_for('auth.admin_login') }}">
              <div class="mb-3">
                <label class="form-label fw-semibold">Admin Krishi ID or Mobile</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-id-badge text-danger"></i></span>
                  <input type="text" name="login_id" id="adminLoginId" class="form-control" placeholder="e.g. ADM-2026-9001 or 9876543230" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Admin Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                  <input type="password" name="password" id="adminPassword" class="form-control" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">
                  <i class="fas fa-shield-alt me-2"></i> Log In as Admin
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- 1-Click Quick Demo Login Chips -->
        <div class="alert alert-light border small text-muted mb-3 p-3">
          <div class="fw-bold text-dark mb-2"><i class="fas fa-bolt text-warning me-1"></i> Quick 1-Click Demo Fill:</div>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm btn-outline-success" onclick="fillCreds('user', '9876543210', 'farmer123', 'tab-farmer-buyer')">
              <i class="fas fa-tractor me-1"></i> Farmer (किसान)
            </button>
            <button type="button" class="btn btn-sm btn-outline-warning text-dark" onclick="fillCreds('user', '9876543220', 'buyer123', 'tab-farmer-buyer')">
              <i class="fas fa-shopping-basket me-1"></i> Buyer (खरीदार)
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillCreds('admin', '9876543230', 'admin123', 'tab-admin')">
              <i class="fas fa-shield-alt me-1"></i> Admin (प्रशासक)
            </button>
          </div>
        </div>

        <div class="text-center pt-2 border-top">
          <span class="text-muted">Don't have an account?</span>
          <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none ms-1">Register as Farmer / Buyer</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function fillCreds(type, id, pass, tabId) {
  const triggerTab = document.getElementById(tabId);
  if (triggerTab) {
    const tabInstance = bootstrap.Tab.getOrCreateInstance(triggerTab);
    tabInstance.show();
  }
  if (type === 'admin') {
    document.getElementById('adminLoginId').value = id;
    document.getElementById('adminPassword').value = pass;
  } else {
    document.getElementById('userLoginId').value = id;
    document.getElementById('userPassword').value = pass;
  }
}
</script>
{% endblock %}
