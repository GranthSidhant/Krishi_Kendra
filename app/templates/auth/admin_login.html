{% extends "base.html" %}

{% block title %}Admin Portal Login - Krishi Kendra{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="k-card shadow-lg border-0 p-4 border-top border-4 border-danger">
        <div class="text-center mb-4">
          <div class="badge bg-danger bg-opacity-10 text-danger p-3 rounded-circle mb-3">
            <i class="fas fa-shield-alt fa-3x"></i>
          </div>
          <h3 class="fw-bold text-dark">Admin & Officer Portal</h3>
          <p class="text-muted small">Government Agriculture Officer / Platform Administrator Access</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Admin Krishi ID or Mobile</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-id-badge text-danger"></i></span>
              <input type="text" name="login_id" id="adminLoginId" class="form-control" placeholder="e.g. ADM-2026-9001 or 9876543230" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Secure Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" name="password" id="adminPassword" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">
              <i class="fas fa-sign-in-alt me-2"></i> Access Admin Portal
            </button>
          </div>
        </form>

        <!-- Demo Admin Credentials Auto-fill -->
        <div class="p-3 bg-light rounded-3 small border mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <strong class="text-danger"><i class="fas fa-key me-1"></i> Demo Admin Account:</strong>
              <div class="text-muted">ID: <code>9876543230</code> | Pass: <code>admin123</code></div>
            </div>
            <button type="button" class="btn btn-xs btn-outline-danger" onclick="document.getElementById('adminLoginId').value='9876543230'; document.getElementById('adminPassword').value='admin123';">
              Auto-Fill
            </button>
          </div>
        </div>

        <div class="text-center pt-2 border-top">
          <a href="{{ url_for('auth.login') }}" class="text-muted small text-decoration-none">
            <i class="fas fa-arrow-left me-1"></i> Switch to Farmer / Buyer Login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
