<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Shape -->
  <rect width="64" height="64" rx="16" fill="url(#kkBg)" />
  
  <!-- Subtle Border Ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Agricultural Sprout & Wheat Stalk Icon -->
  <g filter="url(#shadow)">
    <!-- Right Leaf -->
    <path d="M32 46 C32 46 47 40 47 24 C47 15 39 12 32 17 C32 26 32 38 32 46 Z" fill="url(#leafGrad)" />
    
    <!-- Left Leaf -->
    <path d="M32 46 C32 46 17 40 17 25 C17 17 24 13 32 18 C32 26 32 38 32 46 Z" fill="#16a34a" />
    
    <!-- Center Sprout Stem / Sun Grain Motif -->
    <path d="M32 48 L32 20" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Golden Seed Kernel Accent -->
    <circle cx="32" cy="15" r="3.5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
