[project]
name = "krishi-kendra"
version = "0.1.0"
description = "Krishi Kendra Agricultural Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-JWT-Extended>=4.6.0",
    "Flask-CORS>=4.0.0",
    "Werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "google-genai>=1.0.0"
]

[tool.vercel]
entrypoint = "run:app"
